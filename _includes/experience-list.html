<div class="xp">
{% for x in site.data.experience %}
  <div class="xp__item">
    <div class="xp__logo"><img src="{{ base_path }}/images/logos/{{ x.logo }}" alt="{{ x.org }} logo" width="48" height="48" loading="lazy"></div>
    <div class="xp__main">
      <div class="xp__role">{{ x.role }}</div>
      <div class="xp__dates">{{ x.dates }}</div>
    </div>
    <div class="xp__detail">
      <a class="xp__org" href="{{ x.url }}">{{ x.org }}</a>
      <div class="xp__note">{{ x.note }}</div>
    </div>
  </div>
{% endfor %}
</div>
