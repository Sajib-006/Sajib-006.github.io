<div class="xp">
{% for x in site.data.experience %}
  <div class="xp__item">
    <div class="xp__dates">{{ x.dates }}</div>
    <div class="xp__body">
      <div class="xp__head"><span class="xp__org">{{ x.org }}</span><span class="xp__tag xp__tag--{{ x.type | downcase }}">{{ x.type }}</span></div>
      <div class="xp__role">{{ x.role }}</div>
      <div class="xp__note">{{ x.note }}</div>
    </div>
  </div>
{% endfor %}
</div>
