<div class="mem">
{% for m in site.data.memberships %}
  <div class="mem__card">
    <div class="mem__short">{{ m.short }}</div>
    <div class="mem__name">{{ m.name }}</div>
    <div class="mem__meta">{{ m.role }}{% if m.since != "" %} · since {{ m.since }}{% endif %}</div>
  </div>
{% endfor %}
</div>
