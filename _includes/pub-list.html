{% for category in site.publication_category %}
  {% assign items = site.publications | where: "category", category[0] | sort: "date" | reverse %}
  {% if items.size > 0 %}
  <h3 class="pub__section">{{ category[1].title }}</h3>
  {% for post in items %}
    {% include pub-card.html %}
  {% endfor %}
  {% endif %}
{% endfor %}
